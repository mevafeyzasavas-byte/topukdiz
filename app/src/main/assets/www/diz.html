<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diz</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card-bg:#ffffff;
    --accent:#4f8cff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:16px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:12px;
    max-width:1200px;
    margin:0 auto;
  }
  .thumb{
    position:relative;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    background:var(--card-bg);
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .thumb:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,.15);
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(244,245,247,.97);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
    -webkit-tap-highlight-color:transparent;
  }
  .lightbox.active{display:flex;}
  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,.2);
    user-select:none;
    -webkit-user-drag:none;
    background:#fff;
  }
  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:#ffffff;
    border:none;
    color:#222;
    width:52px;
    height:52px;
    border-radius:50%;
    font-size:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    transition:background .15s ease, transform .15s ease;
    z-index:1001;
  }
  .nav-btn:hover{background:#eef1f6;transform:translateY(-50%) scale(1.05);}
  .nav-btn.prev{left:14px;}
  .nav-btn.next{right:14px;}
  .close-btn{
    position:absolute;
    top:16px;
    right:16px;
    background:#ffffff;
    border:none;
    color:#222;
    width:44px;
    height:44px;
    border-radius:50%;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    z-index:1001;
  }
  .close-btn:hover{background:#eef1f6;}

  @media (max-width:600px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
    .nav-btn{width:42px;height:42px;font-size:20px;}
    .nav-btn.prev{left:6px;}
    .nav-btn.next{right:6px;}
    .close-btn{width:38px;height:38px;top:10px;right:10px;}
  }
  .top-bar{
    position:sticky;
    top:0;
    left:0;
    right:0;
    background:#ffffff;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:8px;
    z-index:1002;
    margin:-16px -16px 16px -16px;
  }
  .top-bar a{
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#222;
    font-size:16px;
    font-weight:600;
  }
  .top-bar a:hover{color:#4f8cff;}

  @media (max-width:600px){
    .top-bar{padding:12px 14px;margin:-16px -16px 12px -16px;}
    .top-bar a{font-size:14px;}
  }
</style>
</head>
<body>

<div class="top-bar"><a href="index.html">&#8592; Ana Sayfaya Dön</a></div>

<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox">
  <button class="close-btn" id="closeBtn">&times;</button>
  <button class="nav-btn prev" id="prevBtn">&#10094;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="nav-btn next" id="nextBtn">&#10095;</button>
</div>

<script>
  const total = 18;
  const grid = document.getElementById('grid');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  let currentIndex = 0;

  for(let i=1;i<=total;i++){
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="diz/${i}.png" alt="${i}" loading="lazy">`;
    div.addEventListener('click', ()=>openLightbox(i-1));
    grid.appendChild(div);
  }

  function openLightbox(index){
    currentIndex = index;
    lightboxImg.src = 'diz/' + (currentIndex+1) + '.png';
    lightbox.classList.add('active');
  }

  function closeLightbox(){
    lightbox.classList.remove('active');
  }

  function showNext(e){
    e.stopPropagation();
    currentIndex = (currentIndex+1) % total;
    lightboxImg.src = 'diz/' + (currentIndex+1) + '.png';
  }

  function showPrev(e){
    e.stopPropagation();
    currentIndex = (currentIndex-1+total) % total;
    lightboxImg.src = 'diz/' + (currentIndex+1) + '.png';
  }

  document.getElementById('closeBtn').addEventListener('click', closeLightbox);
  document.getElementById('nextBtn').addEventListener('click', showNext);
  document.getElementById('prevBtn').addEventListener('click', showPrev);

  // Tıklayınca kapansın (resmin kendisine tıklayınca)
  lightboxImg.addEventListener('click', closeLightbox);

  // Arka plana tıklayınca da kapansın
  lightbox.addEventListener('click', (e)=>{
    if(e.target === lightbox) closeLightbox();
  });

  // Klavye ile gezinme (masaüstü için ekstra)
  document.addEventListener('keydown', (e)=>{
    if(!lightbox.classList.contains('active')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') showNext(e);
    if(e.key === 'ArrowLeft') showPrev(e);
  });

  // Swipe desteği (mobil)
  let touchStartX = 0;
  lightbox.addEventListener('touchstart', (e)=>{
    touchStartX = e.changedTouches[0].screenX;
  });
  lightbox.addEventListener('touchend', (e)=>{
    const touchEndX = e.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    if(Math.abs(diff) > 50){
      if(diff < 0) showNext(e); else showPrev(e);
    }
  });
</script>

</body>
</html>
