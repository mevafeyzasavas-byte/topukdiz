<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seçim</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:#f4f5f7;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .wrap{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .buttons{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
    max-width:640px;
  }
  .btn{
    flex:1 1 220px;
    min-height:160px;
    background:#ffffff;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:600;
    color:#222;
    text-decoration:none;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 26px rgba(0,0,0,.14);
  }
  .btn:active{
    transform:translateY(-1px);
  }

  @media (max-width:600px){
    .btn{
      min-height:130px;
      font-size:19px;
      border-radius:16px;
    }
    .buttons{gap:16px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="buttons">
    <a class="btn" href="topukdikeni.html">Topuk Dikeni</a>
    <a class="btn" href="diz.html">Diz</a>
  </div>
</div>

</body>
</html>
